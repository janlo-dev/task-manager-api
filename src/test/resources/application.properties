# Configuración para tests: sustituye por completo a src/main/resources/application.properties
# BD H2 en memoria, se crea y se destruye en cada ejecución (no toca MySQL)
spring.datasource.url=jdbc:h2:mem:taskmanager-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Clave solo para tests (mínimo 32 bytes para HS256)
jwt.secret=test-secret-key-for-unit-and-integration-tests-only
jwt.expiration-ms=86400000

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
